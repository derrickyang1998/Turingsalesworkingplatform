server {
    client_max_body_size 100m;
    client_body_timeout 240s;
    send_timeout 240s;
    listen 80;
    server_name _;
    charset utf-8;

    location ~* ^/(server|uploads|tmp|backups|node_modules|docs|nginx)(/|$) {
        return 404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location ~* ^/(Dockerfile|Procfile|Makefile|LICENSE|NOTICE)$ {
        return 404;
    }

    location ~* ^/(deploy_v8\.ps1|DEPLOY\.md|package(-lock)?\.json|ecosystem\.config\.js|install\.sh|migrate\.js|app_new\.js|index\.b64|README\.md|CHANGELOG\.md)$ {
        return 404;
    }

    location = /client/shared/build_info.js {
        if ($request_uri !~ ^/client/shared/build_info\.js(?:\?|$)) {
            return 404;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /client/core/navigation.js {
        if ($request_uri !~ ^/client/core/navigation\.js(?:\?|$)) {
            return 404;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /client/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 240s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
