map $http_expect $tm_reject_expect {
    "" 0;
    default 1;
}

map $http_x_request_id $tm_forward_request_id {
    "~^[\x20-\x7E]{8,120}$" $http_x_request_id;
    default $request_id;
}

server {
    client_max_body_size 100m;
    client_body_timeout 10s;
    send_timeout 240s;
    listen 80;
    server_name _;
    charset utf-8;
    proxy_hide_header Content-Security-Policy;
    # Candidate stays inactive until index.html and app.js no longer depend on inline execution.
    # add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; connect-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; form-action 'self'" always;

    location ~* ^/(server|uploads|tmp|backups|node_modules|docs|nginx)(/|$) {
        return 404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location ~* ^/(Dockerfile|Procfile|Makefile|LICENSE|NOTICE)$ {
        return 404;
    }

    location ~* ^/(deploy_v8\.ps1|DEPLOY\.md|package(-lock)?\.json|ecosystem\.config\.js|install\.sh|migrate\.js|app_new\.js|index\.b64|README\.md|CHANGELOG\.md)$ {
        return 404;
    }

    location = /client/shared/build_info.js {
        if ($request_uri !~ ^/client/shared/build_info\.js(?:\?|$)) {
            return 404;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /client/core/navigation.js {
        if ($request_uri !~ ^/client/core/navigation\.js(?:\?|$)) {
            return 404;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /client/core/accessibility.js {
        if ($request_uri !~ ^/client/core/accessibility\.js(?:\?|$)) {
            return 404;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /client/core/shell.js {
        if ($request_uri !~ ^/client/core/shell\.js(?:\?|$)) {
            return 404;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /client/core/csp_compat.js {
        if ($request_uri !~ ^/client/core/csp_compat\.js(?:\?|$)) {
            return 404;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /client/features/ppt_preview_runtime.js {
        if ($request_uri !~ ^/client/features/ppt_preview_runtime\.js(?:\?|$)) {
            return 404;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /client/styles/tokens.css {
        if ($request_uri !~ ^/client/styles/tokens\.css(?:\?|$)) {
            return 404;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /client/styles/components.css {
        if ($request_uri !~ ^/client/styles/components\.css(?:\?|$)) {
            return 404;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /client/styles/layout.css {
        if ($request_uri !~ ^/client/styles/layout\.css(?:\?|$)) {
            return 404;
        }
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /client/ {
        return 404;
    }

    location = /api/knowledge/upload {
        if ($tm_reject_expect) {
            return 417 "";
        }
        client_max_body_size 22020096;
        client_body_timeout 10s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $tm_forward_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 240s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    location = /api/influencers/upload {
        if ($tm_reject_expect) {
            return 417 "";
        }
        client_max_body_size 22020096;
        client_body_timeout 10s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $tm_forward_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 240s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    location = /api/demand/parse-file {
        if ($tm_reject_expect) {
            return 417 "";
        }
        client_max_body_size 22020096;
        client_body_timeout 10s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $tm_forward_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 240s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    location ~ ^/api/campaigns/[1-9][0-9]*/reviews$ {
        if ($tm_reject_expect) {
            return 417 "";
        }
        client_max_body_size 1048576;
        client_body_timeout 10s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $tm_forward_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 240s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    location ~ ^/api/campaigns(?:/|$) {
        if ($tm_reject_expect) {
            return 417 "";
        }
        client_max_body_size 65536;
        client_body_timeout 10s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $tm_forward_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 240s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    location /api/ {
        if ($tm_reject_expect) {
            return 417 "";
        }
        client_max_body_size 52428800;
        client_body_timeout 10s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $tm_forward_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 240s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
